<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">登録 | わが家の光熱費ダッシュボード</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

  <header class="site-header">
    <p class="site-title">わが家の光熱費ダッシュボード</p>
    <nav class="site-nav" id="site-nav">
      <a href="../index.html">ホーム</a>
      <a href="electricity.html">電気代登録</a>
      <a href="water.html">水道代登録</a>
      <!-- categories.json にある電気代・水道代以外のカテゴリへのリンクは
           lib/nav.js が自動的にここへ追加する（拡張設計のポイント） -->
    </nav>
  </header>

  <main class="page-container page-container--narrow">

    <!-- ============================================================
         このページは特定のカテゴリ専用ではなく、URLの ?category=xxx で
         対象を切り替える汎用ページです。
         例: manual.html?category=gas なら categories.json の "gas" エントリを使う。
         手入力タイプの新規カテゴリは、このページを使えばHTML/JSの追加なしで
         登録画面が用意できます（使用量の有無は categories.json の hasUsage で自動判定）。
    ============================================================= */
    -->
    <h1 id="page-heading">登録</h1>
    <p class="page-description" id="page-description"></p>

    <p id="category-error" class="form-error" role="alert" hidden>
      指定されたカテゴリが見つかりませんでした。URLの category パラメータをご確認ください。
    </p>

    <form id="manual-form" class="input-form" novalidate hidden>

      <div class="form-group">
        <label for="year-month">対象年月<span class="required-mark">必須</span></label>
        <input type="month" id="year-month" name="yearMonth" required />
      </div>

      <div class="form-group">
        <label for="amount">請求額（円）<span class="required-mark">必須</span></label>
        <input type="number" id="amount" name="amount" min="0" step="1" inputmode="numeric" required />
      </div>

      <!-- categories.json の hasUsage が false のカテゴリでは、manual.js がこのブロックごと非表示にする -->
      <div class="form-group" id="usage-group">
        <label for="usage" id="usage-label">使用量</label>
        <input type="number" id="usage" name="usage" min="0" step="0.1" inputmode="decimal" />
      </div>

      <div class="form-group">
        <label for="memo">備考</label>
        <textarea id="memo" name="memo" rows="3"></textarea>
      </div>

      <p id="form-error" class="form-error" role="alert" hidden></p>
      <p id="form-overwrite-warning" class="form-warning" role="status" hidden>
        同じ年月のデータが既に登録されています。登録すると上書きされます。
      </p>

      <div class="form-actions">
        <button type="submit" id="submit-button" class="button button--primary">登録</button>
        <span id="submit-status" class="submit-status" role="status" aria-live="polite"></span>
      </div>

    </form>

  </main>

  <footer class="site-footer">
    <p>データはすべて<a href="https://github.com" target="_blank" rel="noopener">GitHub</a>上のCSVで管理されています。</p>
  </footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/lib/csv.js"></script>
  <script src="../assets/js/lib/github-api.js"></script>
  <script src="../assets/js/lib/nav.js"></script>
  <script src="../assets/js/input/manual.js"></script>

</body>
</html>
